<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="drop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- Blood drop shape: pointed top, round bottom -->
  <!-- Classic blood drop: teardrop pointing upward, bulge at bottom -->
  <path d="M96,22 
           C96,22 54,72 54,108 
           C54,132 73,150 96,150 
           C119,150 138,132 138,108 
           C138,72 96,22 96,22 Z"
        fill="url(#drop)" filter="url(#glow)"/>

  <!-- Shine highlight on drop -->
  <ellipse cx="80" cy="90" rx="8" ry="14"
           fill="rgba(255,255,255,0.35)"
           transform="rotate(-20,80,90)"/>
  <ellipse cx="86" cy="78" rx="4" ry="6"
           fill="rgba(255,255,255,0.2)"
           transform="rotate(-20,86,78)"/>

  <!-- Text: BILI -->
  <text x="96" y="176"
        text-anchor="middle"
        font-family="'Trebuchet MS', sans-serif"
        font-size="20"
        font-weight="900"
        letter-spacing="2"
        fill="#ffffff">BILI APP</text>
</svg>
